{% set name = "flory" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/flory-{{ version }}.tar.gz
  sha256: a25361a4781da24bd6afb295efe0ec6f761be9967b0c2aca402aaa6fee056a5f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - numba >=0.57
    - numpy >=1.22
    - scipy >=1.7
    - tqdm >=4.60

test:
  imports:
    - flory
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Python package for finding coexisting phases in multicomponent mixtures
  license: MIT
  license_file: LICENSE
  home: https://github.com/qiangyicheng/flory
  doc_url: https://flory.readthedocs.io/

extra:
  recipe-maintainers:
    - david-zwicker
    - qiangyicheng
